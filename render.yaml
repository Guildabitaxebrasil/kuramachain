# Blueprint do Render (https://render.com/docs/blueprint-spec)
#
# Um único serviço web: o Flask serve a API e o build do Vite na mesma
# origem (o frontend usa baseURL '/'). O Dockerfile faz as duas etapas
# (Node builda o SPA, Python roda o gunicorn).
#
# Deploy: no Render, New > Blueprint, aponte para este repositório.
# Nenhuma variável secreta é necessária para um nó único.
#
# Persistência: a cadeia e a mempool vivem na memória do processo, então o
# nó grava CHAIN_FILE a cada bloco aceito. O disco do container é efêmero
# (some em deploy, restart e spin-down), por isso o volume persistente
# abaixo, montado em /var/data. Disco no Render só existe em plano pago —
# o free recusa `disk:` — então o plano aqui é `starter` (US$7/mês) mais
# US$0,25/GB/mês do disco de 1GB.
services:
  - type: web
    name: kuramachain
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    # Só o que está sob mountPath sobrevive a deploy/restart/spin-down.
    # Serviço com disco não escala horizontalmente — e o nó é 1 worker de
    # propósito, porque a cadeia vive na memória do processo.
    disk:
      name: kuramachain-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Demonstração pública: /wallet/new NÃO devolve a chave privada
      # (KURAMA_DEV_EXPOSE_KEYS fica no default false). O envio de
      # transações da UI exige assinatura no cliente; não ligue o
      # opt-in de chave privada em um deploy público.
      - key: KURAMA_PRODUCTION
        value: "false"
      # Opt-in explícito desligado: /wallet/new não devolve chave privada.
      - key: KURAMA_DEV_EXPOSE_KEYS
        value: "false"
      # Estado persistente no volume, nunca no /app (efêmero).
      - key: DATA_DIR
        value: /var/data
      - key: CHAIN_FILE
        value: /var/data/blockchain.json
      # No Render, remote_addr é o proxy. TRUST_PROXY_HEADERS habilita
      # a leitura de X-Forwarded-For para obter o IP real do cliente.
      # Sem isso, todos compartilham um único bucket de rate limit.
      - key: TRUST_PROXY_HEADERS
        value: "true"
