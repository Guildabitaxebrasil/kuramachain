# Blueprint do Render (https://render.com/docs/blueprint-spec)
#
# Um único serviço web: o Flask serve a API e o build do Vite na mesma
# origem (o frontend usa baseURL '/'). O Dockerfile faz as duas etapas
# (Node builda o SPA, Python roda o gunicorn).
#
# Deploy: no Render, New > Blueprint, aponte para este repositório.
# Nenhuma variável secreta é necessária para um nó único.
#
# Persistência: o nó carrega CHAIN_FILE no boot e regrava a cada bloco
# aceito. No plano free o disco do container é efêmero — deploy, restart e
# spin-down por inatividade apagam o arquivo — e disco persistente só
# existe em serviço pago, então NÃO há `disk:` aqui de propósito. Enquanto
# o serviço for free, a cadeia só sobrevive a restarts com um armazenamento
# externo (banco/objeto) configurado no ambiente.
services:
  - type: web
    name: kuramachain
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # /wallet/new e /wallet/restore devolvem a chave privada da carteira
      # criada/restaurada para o próprio navegador que a pediu, que a guarda
      # no localStorage para assinar as transações. Sem isso toda carteira
      # salva ficava sem chave e o envio pela UI era impossível.
      # Só a carteira recém-criada/restaurada recebe a chave, uma única vez
      # por resposta: qualquer outra carteira exige a frase de 24 palavras.
      - key: KURAMA_PRODUCTION
        value: "false"
      - key: KURAMA_DEV_EXPOSE_KEYS
        value: "true"
      - key: DATA_DIR
        value: data
      - key: CHAIN_FILE
        value: data/blockchain.json
      # No Render, remote_addr é o proxy. TRUST_PROXY_HEADERS habilita
      # a leitura de X-Forwarded-For para obter o IP real do cliente.
      # Sem isso, todos compartilham um único bucket de rate limit.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Espelho remoto da cadeia (ver core/chain_backup.py): cole aqui a
      # connection string de um Postgres externo gratuito (Neon, Supabase).
      # Sem ela o nó roda igual, mas a cadeia volta ao gênese quando o
      # container é recriado. `sync: false` faz o Render pedir o valor no
      # dashboard em vez de guardá-lo no repositório.
      # - key: KURAMA_BACKUP_DATABASE_URL
      #   sync: false
      # Identidade fixa do nó: cole aqui as 24 palavras da carteira que
      # minera. Sem isso o endereço minerador é lido de WALLET_FILE, que
      # no plano free desaparece a cada deploy (endereço muda e as
      # recompensas já mineradas ficam órfãs).
      # - key: KURAMA_NODE_MNEMONIC
      #   sync: false
