[pytest]
# Roda só a suíte do projeto. Sem isto, `python -m pytest` também coleta os
# testes das bibliotecas vendorizadas em `python-embed/` (ecdsa, colorama...)
# e aborta com `ModuleNotFoundError: hypothesis`.
testpaths = tests
norecursedirs = python-embed node_modules frontend data certs .git __pycache__ .pytest_cache
